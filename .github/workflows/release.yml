name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always
  RELEASES_REPO: AlexMartosP/mux-releases

permissions:
  contents: write

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            target: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.tar.gz.sig

  publish-to-releases-repo:
    needs: build-tauri
    runs-on: ubuntu-latest
    steps:
      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: find artifacts -type f | head -50

      - name: Generate latest.json
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Find the signature files
          AARCH64_SIG=$(cat artifacts/*aarch64*/*.sig 2>/dev/null || cat artifacts/*.sig 2>/dev/null | head -1 || echo "")
          X64_SIG=$(cat artifacts/*x86_64*/*.sig 2>/dev/null || cat artifacts/*.sig 2>/dev/null | tail -1 || echo "")

          # If we can't find separate sigs, try to find them differently
          if [ -z "$AARCH64_SIG" ]; then
            AARCH64_SIG=$(find artifacts -name "*.sig" -path "*aarch64*" -exec cat {} \; 2>/dev/null || echo "")
          fi
          if [ -z "$X64_SIG" ]; then
            X64_SIG=$(find artifacts -name "*.sig" -path "*x86_64*" -exec cat {} \; 2>/dev/null || echo "")
          fi

          cat > latest.json << EOF
          {
            "version": "${VERSION}",
            "notes": "Mux v${VERSION}",
            "pub_date": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platforms": {
              "darwin-aarch64": {
                "url": "https://github.com/${RELEASES_REPO}/releases/download/v${VERSION}/Mux.app.tar.gz",
                "signature": "${AARCH64_SIG}"
              },
              "darwin-x86_64": {
                "url": "https://github.com/${RELEASES_REPO}/releases/download/v${VERSION}/Mux_x64.app.tar.gz",
                "signature": "${X64_SIG}"
              }
            }
          }
          EOF

          cat latest.json

      - name: Prepare release files
        run: |
          mkdir -p release-files

          # Copy and rename files for clarity
          find artifacts -name "*.dmg" -path "*aarch64*" -exec cp {} release-files/Mux_aarch64.dmg \; 2>/dev/null || true
          find artifacts -name "*.dmg" -path "*x86_64*" -exec cp {} release-files/Mux_x64.dmg \; 2>/dev/null || true
          find artifacts -name "*.tar.gz" -not -name "*.sig" -path "*aarch64*" -exec cp {} release-files/Mux.app.tar.gz \; 2>/dev/null || true
          find artifacts -name "*.tar.gz" -not -name "*.sig" -path "*x86_64*" -exec cp {} release-files/Mux_x64.app.tar.gz \; 2>/dev/null || true

          cp latest.json release-files/

          ls -la release-files/

      - name: Create release in public repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"

          # Create the release
          gh release create "v${VERSION}" \
            --repo "${{ env.RELEASES_REPO }}" \
            --title "Mux v${VERSION}" \
            --notes "Mux v${VERSION}" \
            release-files/*
